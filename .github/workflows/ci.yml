name: Validate Sink
on:
  push:
    branches: [master, 'codex/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NUXT_SITE_TOKEN: sink-ci-tests-only-no-production-access
      NUXT_PUBLIC_PREVIEW_MODE: ''
      NUXT_API_CORS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm types:check
      - run: pnpm build
      - run: pnpm test --run
      - run: python3 -m unittest discover -s scripts -p 'test_dub_to_sink.py' -v
